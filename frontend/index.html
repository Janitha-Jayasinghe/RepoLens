<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#0A0A0A" /><meta name="description" content="RepoLens: public GitHub repository analytics." /><title>RepoLens</title><script>try{const saved=localStorage.getItem('repolens.theme');document.documentElement.dataset.theme=saved==='dark'||saved==='light'?saved:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
